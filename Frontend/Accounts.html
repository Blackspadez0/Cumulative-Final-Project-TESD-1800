<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <script src="Accounts.js" type="module"></script>
        <style>
            /* Reset default browser margins and padding */
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }

            /* Navbar container styling using Flexbox */
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #333;
                padding: 10px 20px;
            }

            /* Branding/Logo styling */
            .navbar-logo a {
                color: #ffffff;
                font-size: 24px;
                font-weight: bold;
                text-decoration: none;
            }

            /* Navigation links wrapper */
            .nav-links {
                list-style: none; /* Removes bullet points */
                margin: 0;
                padding: 0;
                display: flex; /* Aligns list items horizontally */
                gap: 20px; /* Spaces out the links */
            }

            /* Individual link styling */
            .nav-links a {
                color: #ffffff;
                text-decoration: none; /* Removes underline */
                font-size: 16px;
                padding: 8px 12px;
                transition: background-color 0.3s ease;
                border-radius: 4px;
            }

            /* Hover effect for links */
            .nav-links a:hover {
                background-color: #555;
                color: #00ecb9;
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="Products.html">Products</a></li>
                <li><a href="Index.html">Home</a></li>
            </ul>
        </nav>

        <main>
            <form id="account-form">
                <label>Email: <input name="Email" type="email" required autocomplete="email" /></label>
                <label>Password: <input name="Password" type="password" required autocomplete="new-password" /></label>
                <button type="submit">Create Account</button>
            </form>
            <p id="account-message" role="status" aria-live="polite" hidden></p>
        </main>
    </body>
</html>
